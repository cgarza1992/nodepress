name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-baselines:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Prepare Storybook Vercel output
        run: |
          rm -rf .vercel
          mkdir -p .vercel/output/static
          cp -r storybook-static/* .vercel/output/static/
          echo '{"version":3}' > .vercel/output/config.json

      - name: Deploy Storybook to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STORYBOOK_PROJECT_ID }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Update visual regression baselines
        run: npx playwright test --update-snapshots
        env:
          STORYBOOK_URL: https://storybook.christophergarza.dev

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__snapshots__
          git diff --staged --quiet || git commit -m "chore: update visual regression baselines"
          git push
